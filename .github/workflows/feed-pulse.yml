name: FeedPulse CI

on:
  pull_request:
    paths:
      - 'feed-pulse/**'
      - '.github/workflows/feed-pulse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: feed-pulse

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: feed-pulse/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check scripts/feed-pulse.js
          node --check lib/config.js
          node --check lib/errors.js
          node --check lib/feed.js
          node --check lib/http.js
          node --check lib/runtime.js

      - name: Test
        run: npm test
