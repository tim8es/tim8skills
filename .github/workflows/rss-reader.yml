name: RSS Reader CI

on:
  pull_request:
    paths:
      - 'rss-reader/**'
      - '.github/workflows/rss-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: rss-reader

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        if: matrix.node-version == 22
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(rss-reader): lock npm dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Syntax check
        run: |
          node --check scripts/rss.js
          node --check lib/config.js
          node --check lib/errors.js
          node --check lib/feed.js
          node --check lib/http.js
          node --check lib/releases.js
          node --check lib/runtime.js

      - name: Test
        run: npm test
