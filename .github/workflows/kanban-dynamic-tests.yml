name: Kanban dynamic-workflow regression
on:
  push:
    branches:
      - feat/kanban-dynamic-workflows
    paths:
      - 'obsidian-kanban/**'
      - '.github/workflows/kanban-dynamic-tests.yml'
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned upstream Claude-DSL runtime
        uses: actions/checkout@v4
        with:
          repository: scasella/claude-dynamic-workflows-codex
          ref: 16524bea870a51ac7bfb3dc7dce77e333c7a56e1
          path: _upstream
          persist-credentials: false
      - name: Upstream JavaScript workflow dry-run
        run: |
          printf '%s' '{"task":"Add a small feature","acceptance":["Function works","Tests pass"],"allowWrites":true}' > /tmp/kanban-demo-args.json
          node _upstream/runner/bin/run-workflow.js obsidian-kanban/templates/dynamic-implementation.workflow.js --plan --args-file /tmp/kanban-demo-args.json
      - name: Real upstream runner bridge — no-model smoke
        run: |
          mkdir -p /tmp/kanban-dynamic-smoke/tasks
          printf 'reviewed fixture' > /tmp/kanban-dynamic-smoke/deliverable.txt
          cat > /tmp/kanban-dynamic-smoke/demo.workflow.js <<'JS'
          export const meta = { name: "kanban-bridge-smoke", phases: [{title:"Check"}] };
          phase("Check");
          return {approved:true, source:"no-agent-smoke"};
          JS
          python obsidian-kanban/scripts/kanban.py dynamic run /tmp/kanban-dynamic-smoke smoke \
            --workflow demo.workflow.js \
            --runner "$GITHUB_WORKSPACE/_upstream/runner/bin/run-workflow.js" --approve-execution
          python obsidian-kanban/scripts/kanban.py dynamic resume /tmp/kanban-dynamic-smoke smoke \
            --workflow demo.workflow.js \
            --runner "$GITHUB_WORKSPACE/_upstream/runner/bin/run-workflow.js" --approve-execution
          python obsidian-kanban/scripts/kanban.py dynamic verify /tmp/kanban-dynamic-smoke smoke \
            --test-cmd "python -c 'print(1 + 1 == 2)'" --artifact deliverable.txt
          python obsidian-kanban/scripts/kanban.py dynamic status /tmp/kanban-dynamic-smoke smoke
      - name: Reproducible benchmark dry-run (zero model calls)
        run: |
          python obsidian-kanban/scripts/kanban.py dynamic-benchmark \
            obsidian-kanban/evals/manifest.example.json \
            --runner "$GITHUB_WORKSPACE/_upstream/runner/bin/run-workflow.js" \
            --model test-model --repeat 2
      - name: Existing Kanban regression suite
        run: python -m unittest discover -s obsidian-kanban/scripts -p 'test_kanban.py' -q
      - name: Dynamic workflow bridge and evidence gate
        run: python -m unittest discover -s obsidian-kanban/scripts -p 'test_dynamic_workflow.py' -q
